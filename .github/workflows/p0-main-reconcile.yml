name: WolfOS P0 main reconciliation
# Bot-initiated merges may not emit a normal push-triggered workflow run.
# Reconcile the EXACT current main SHA; never substitute a green PR run.
on:
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:

permissions:
  contents: read
  actions: write

concurrency:
  group: wolfos-p0-main-reconciliation
  cancel-in-progress: false

jobs:
  ensure-exact-main-p0:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require exact main SHA and independent full P0 evidence
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          repo="${GITHUB_REPOSITORY}"
          head="$(gh api "repos/${repo}/branches/main" --jq '.commit.sha')"
          if [[ ! "$head" =~ ^[a-f0-9]{40}$ ]]; then
            echo "::error::Cannot authenticate exact main SHA"; exit 1
          fi
          echo "Reconcile main HEAD: $head"
          # Inspect independent FULL P0 runs for main, not a green PR run.
          data="$(gh api "repos/${repo}/actions/workflows/p0.yml/runs?branch=main&per_page=100")"
          latest="$(jq -r --arg sha "$head" '
            [.workflow_runs[]
              | select(.head_sha == $sha)
              | select(.event == "push" or .event == "workflow_dispatch" or .event == "schedule")]
            | sort_by(.created_at, .run_attempt) | last
            | if . == null then "" else [.id, .status, (.conclusion // "")] | @tsv end
          ' <<<"$data")"
          if [[ -n "$latest" ]]; then
            IFS=$'\t' read -r run_id status conclusion <<<"$latest"
            echo "Exact main P0: $run_id / $status / ${conclusion:-none}"
            if [[ "$status" == "completed" && "$conclusion" == "success" ]]; then
              echo "PASS: exact merged main SHA passed complete P0."
              exit 0
            fi
            if [[ "$status" != "completed" ]]; then
              echo "PENDING: existing full P0 has not finished."
              exit 0
            fi
            echo "::error::Exact-main P0 failed (${run_id}, ${conclusion}); investigate before retry."
            exit 1
          fi
          # A successful dispatch is NOT test success. Follow the full job.
          after="$(gh api "repos/${repo}/branches/main" --jq '.commit.sha')"
          if [[ "$head" != "$after" ]]; then
            echo "::error::main changed; refuse stale dispatch and retry later"
            exit 1
          fi
          echo "MISSING: dispatch entire WolfOS P0 on main SHA $head"
          gh api --method POST "repos/${repo}/actions/workflows/p0.yml/dispatches" -f ref=main
          echo "REQUESTED ONLY: full P0 must complete on this SHA before any green claim."
