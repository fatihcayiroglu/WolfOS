name: WolfOS P0
# Full QEMU suite once per PR update and once after each main merge.
# Manual dispatch remains available to exercise an unpublished branch.
on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

# Each PR checks only its latest head, but never cancel the mandatory
# post-merge main workflow run (or a manually dispatched verification).
concurrency:
  group: wolfos-p0-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build-and-boot:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - name: Install VM build tools
        run: |
          # Fail closed on hung mirrors without skipping any build/QEMU gate.
          sudo timeout --signal=TERM --kill-after=15s 420s apt-get \
            -o Acquire::Retries=3 -o Acquire::http::Timeout=40 \
            -o Acquire::https::Timeout=40 update
          sudo env DEBIAN_FRONTEND=noninteractive timeout \
            --signal=TERM --kill-after=15s 720s apt-get \
            -o Acquire::Retries=3 -o Acquire::http::Timeout=40 \
            -o Acquire::https::Timeout=40 install -y --no-install-recommends \
            xorriso qemu-system-x86 seabios make git binutils
          # Package mirrors occasionally take 7+ minutes fetching QEMU 11MB.
          # Bounded 12-minute install timeout preserves fail-closed behavior;
          # 30-minute job still has headroom for EVERY mandatory QEMU smoke.
          # QEMU smoke runs from an ISO using PC BIOS, not GUI/audio backends.
          # Explicitly fail if the headless emulator or ISO builder is absent.
          command -v qemu-system-x86_64
          command -v xorriso
      - name: Rust toolchain
        uses: dtolnay/rust-toolchain@nightly
        with:
          targets: x86_64-unknown-none
      - name: Offline source contract checks
        run: make test
      - name: Build and smoke test in QEMU
        run: make smoke
      - name: First interactive COM1 shell commands in QEMU (BSP-only)
        run: make serial-shell-smoke
      - name: Real PS/2 keyboard input to Rust framebuffer text (QEMU HMP sendkey)
        run: make ps2-graphics-smoke
      - name: Original framebuffer console cursor wrap and real QEMU scroll pixels
        run: make framebuffer-console-smoke
      - name: CPU invalid-opcode exception smoke test
        run: make exception-smoke
      - name: Paging map/unmap and page-fault smoke test
        run: make paging-fault-smoke
      - name: P2 ELF64 strict ET_EXEC preflight (QEMU, no user execution)
        run: make elf64-preflight-smoke
      - name: P2 user shadow PML4, page permissions and PMM ownership (QEMU)
        run: make user-vm-shadow-smoke
      - name: BSP address-space retirement gate with real CR3 activation and inactive-root PMM cleanup (1/4 vCPUs)
        run: make address-space-retirement-smoke
      - name: Active frame ownership, safe Drop and four real CPU CR3 departures, including withheld last AP
        run: make smp-address-space-retirement-smoke
      - name: P2 user descriptor and TSS.RSP0 / TR preflight (CPL0-only QEMU)
        run: make user-ring-prep-smoke
      - name: P2 REAL CPL3 / INT80 / IRETQ roundtrip (single-vCPU QEMU)
        run: make user-ring3-smoke
      - name: P2 independent sanitized CR3 and REAL denied CPL3 kernel read (#PF)
        run: make user-ring3-isolation-smoke
      - name: P2 actual RAX/RDI/RSI syscall ABI with GPR-preserving INT80 and IRETQ (QEMU)
        run: make user-syscall-smoke
      - name: P2 independently linked ELF64 hello from real CPL3 with physical-frame cleanup
        run: make user-elf-run-smoke
      - name: P2 two real sequential Ring3 ELF processes with PID generation and verified full cleanup
        run: make user-process-smoke
      - name: P2 original RamFS staged ELF64 native Hello executes as real Ring3 process and reaps
        run: make user-ramfs-smoke
      - name: P2 native VFS root/tmp mounts, PID-owned FDs and real ELF64 CPL3 boot
        run: make user-vfs-smoke
      - name: P2 real user-pointer WRITE syscall via private user CR3 and denied kernel/RX writes
        run: make user-copy-smoke
      - name: P2 genuine CPL3 OPEN READ CLOSE, bad pointers, stale fd, exact 7-frame cleanup
        run: make user-file-io-smoke
      - name: P2 three simultaneous reserved PIDs with disjoint real PMM frames and safe cancellation
        run: make process-table-smoke
      - name: P2 saved per-PID user IRET frame and separate RSP0 preflight (no hardware handoff)
        run: make user-context-smoke
      - name: P2 real PMM-backed 16KiB per-PID kernel stacks, canaries and no-leak retirement
        run: make kernel-stack-lease-smoke
      - name: P2 real discontiguous PMM supervisor stack guarded mapping and zero-leak cleanup
        run: make kernel-stack-guard-smoke
      - name: P2 x86-64 actual non-present lower stack guard supervisor page fault
        run: make kernel-stack-guard-fault-smoke
      - name: P2 x86-64 actual non-present upper stack guard supervisor page fault
        run: make kernel-stack-guard-upper-fault-smoke
      - name: P2 high-half supervisor arena two PID stacks and guarded PMM cleanup
        run: make high-half-stack-arena-smoke
      - name: P2 real high-half PID1 lower guard supervisor #PF
        run: make high-half-stack-arena-lower-fault-smoke
      - name: P2 real high-half PID2 upper guard supervisor #PF
        run: make high-half-stack-arena-upper-fault-smoke
      - name: P2 real BSP per-PID legacy FXSAVE64 FXRSTOR64 across 64 changes and exact PMM cleanup
        run: make user-fx-smoke
      - name: P2 actual CR3 TSS.RSP0 and FXSAVE64 synchronized handoff between two guarded READY PIDs (BSP-only)
        run: make p2-handoff-preflight-smoke
      - name: P2 actual two native ELF Ring3 cooperative INT80 yield with distinct guarded RSP0 CR3 FXSAVE64 and complete PMM cleanup
        run: make p2-ring3-yield-smoke
      - name: P3 genuine two-ELF CPL3 WAIT SIGNAL resumed IRET with one-use event ticket and no PMM leaks
        run: make p3-ring3-event-wait-hardware-smoke
      - name: P3 genuine BSP xAPIC IRQ wakes Blocked CPL3 WAIT, returns original IRET, strict EOI and 1/4-vCPU QEMU
        run: make p3-ring3-irq-event-wake-smoke
      - name: P2 two actual native Ring3 ELF IF-enabled contexts with checked PID CR3 TSS FX and masked PIC (QEMU)
        run: make p2-ring3-irq-ready-smoke
      - name: P2 real xAPIC timer IRQ observed in two separate CPL3 ELF busy loops, guarded TSS.RSP0 and private CR3
        run: make p2-ring3-timer-observe-smoke
      - name: Four-vCPU ACPI MADT topology smoke test
        run: make topology-smoke
      - name: P2 real involuntary xAPIC IRQ switches to OTHER native Ring3 ELF in private CR3 with TSS FX and full cleanup
        run: make p2-ring3-timer-preempt-smoke
      - name: P2 two independent native Ring3 ELFs with >=8 real xAPIC timer switches and zero voluntary yields
        run: make p2-ring3-timer-nonyield-smoke
      - name: P3 four independent no-yield ELF64 images checked by the real kernel ELF preflight (two still execute)
        run: make p3-ring3-four-elf-preflight-smoke
      - name: P3 four genuinely executing native Ring3 ELF64 users and xAPIC IRQ fairness (BSP-only)
        run: make p3-ring3-four-live-smoke
      - name: BSP directed fixed xAPIC IPIs to three APs (4 vCPUs)
        run: make ap-ipi-smoke
      - name: Real 4-vCPU IPI local INVLPG and generation-tagged TLB acknowledgements
        run: make tlb-shootdown-hardware-smoke
      - name: Directed IPIs wake three AP-owned remote work mailboxes (4 vCPUs)
        run: make ap-remote-work-smoke
      - name: Per-AP bounded four-slot FIFO, backpressure and overlapping IPI-woken work (4 vCPUs)
        run: make ap-runqueue-smoke
      - name: Quiesced single logical task changes AP owners via directed IPI (4 vCPUs)
        run: make ap-handoff-smoke
      - name: One real saved-RSP and FXSAVE64 kernel task resumes on other APs (4 vCPUs)
        run: make ap-stack-migrate-smoke
      - name: IRQ-preempted full-GPR and FX kernel frame resumes on another AP (4 vCPUs)
        run: make ap-irq-migrate-smoke
      - name: Independent local periodic xAPIC timer IRQs on three APs (4 vCPUs)
        run: make ap-local-timer-smoke
      - name: Three APs independently preempt two private kernel tasks by local IRQ (4 vCPUs)
        run: make ap-smp-preempt-smoke
      - name: PIT IRQ0 hardware timer smoke (single BSP only)
        run: make timer-smoke
      - name: xAPIC periodic timer hardware IRQ smoke (single BSP only)
        run: make apic-timer-smoke
      - name: PIT2-referenced xAPIC periodic timer calibration smoke (1 and 4 vCPUs)
        run: make apic-calibration-smoke
      - name: BSP genuine two-stack involuntary xAPIC timer preemption proof (1 and 4 vCPUs)
        run: make apic-preempt-smoke
      - name: Preserve ISO on failure
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: wolfos-p0-iso
          path: out/*.iso
          if-no-files-found: ignore
