[package]
name = "wolfos-kernel"
version = "0.1.0"
edition = "2024"
authors = ["WolfOS Contributors"]
publish = false

[[bin]]
name = "wolfos-kernel"
path = "kernel/src/main.rs"

[dependencies]
limine = "=0.6.5"
x86_64 = { version = "=0.15.5", features = ["abi_x86_interrupt"] }

[features]
default = []
smoke-exit = []
# Opt-in BSP polling diagnostics; does not write disks or launch applications.
serial-shell = []
# QEMU-only polling of PS/2 set-1 keyboard into bounded framebuffer cells.
ps2-graphics-demo = []
# Separate QEMU boot for edited graphical help; preserves the original ABD test.
ps2-graphics-help-smoke = ["ps2-graphics-demo"]
# Read-only memory and boot-cached PCI diagnostics, two fresh QEMU boots.
ps2-graphics-info-smoke = ["ps2-graphics-demo"]
# Isolated two-row QEMU framebuffer scroll and pixel-readback proof.
framebuffer-console-smoke = ["smoke-exit"]
address-space-retirement-smoke = ["smoke-exit"]
smp-address-space-retirement-smoke = ["smoke-exit"]
exception-smoke = ["smoke-exit"]
paging-fault-smoke = ["smoke-exit"]
timer-smoke = ["smoke-exit"]
apic-timer-smoke = ["smoke-exit"]
apic-calibration-smoke = ["smoke-exit"]
apic-preempt-smoke = ["smoke-exit"]
ap-ipi-smoke = ["smoke-exit"]
tlb-shootdown-hardware-smoke = ["smoke-exit"]
ap-local-timer-smoke = ["smoke-exit"]
ap-smp-preempt-smoke = ["smoke-exit"]
ap-remote-work-smoke = ["smoke-exit"]
ap-handoff-smoke = ["smoke-exit"]
ap-stack-migrate-smoke = ["smoke-exit"]
ap-irq-migrate-smoke = ["smoke-exit"]
ap-runqueue-smoke = ["smoke-exit"]
elf64-preflight-smoke = ["smoke-exit"]
user-vm-shadow-smoke = ["smoke-exit"]
user-ring-prep-smoke = ["smoke-exit"]
user-ring3-smoke = ["smoke-exit"]
user-ring3-isolation-smoke = ["smoke-exit"]
user-syscall-smoke = ["smoke-exit"]
user-elf-run-smoke = ["smoke-exit"]
user-process-smoke = ["smoke-exit"]
user-ramfs-smoke = ["smoke-exit"]
user-vfs-smoke = ["smoke-exit"]
user-copy-smoke = ["smoke-exit"]
user-file-io-smoke = ["smoke-exit"]
process-table-smoke = ["smoke-exit"]
user-context-smoke = ["smoke-exit"]
kernel-stack-lease-smoke = ["smoke-exit"]
kernel-stack-guard-smoke = ["smoke-exit"]
kernel-stack-guard-fault-smoke = ["smoke-exit"]
kernel-stack-guard-upper-fault-smoke = ["smoke-exit"]
high-half-stack-arena-smoke = ["smoke-exit"]
high-half-stack-arena-lower-fault-smoke = ["smoke-exit"]
high-half-stack-arena-upper-fault-smoke = ["smoke-exit"]
user-fx-smoke = ["smoke-exit"]
p2-handoff-preflight-smoke = ["smoke-exit"]
p2-ring3-yield-smoke = ["smoke-exit"]
# Isolated, truly executing two-user CPL3 WAIT→SIGNAL→IRET proof.
# The historical cooperative/timer QEMU flavors are NOT modified.
p3-ring3-event-wait-hardware-smoke = ["p2-ring3-yield-smoke"]
# Isolated genuine xAPIC IRQ → BLOCKED Ring3 wait → original saved IRET QEMU gate.
# Reuses existing IF-enabled timer evidence but does not alter prior QEMU flavors.
p3-ring3-irq-event-wake-smoke = ["p3-ring3-event-wait-hardware-smoke", "p2-ring3-timer-observe-smoke"]
p2-ring3-irq-ready-smoke = ["smoke-exit"]
p2-ring3-timer-observe-smoke = ["smoke-exit"]
p2-ring3-timer-preempt-smoke = ["smoke-exit"]
# Separate regression flavor; inherits legacy IRQ plumbing but runs native no-yield ELFs.
p2-ring3-timer-nonyield-smoke = ["p2-ring3-timer-preempt-smoke"]
# Isolated four-native-ELF kernel admission only; two legacy users still execute.
p3-ring3-four-elf-preflight-smoke = ["p2-ring3-timer-nonyield-smoke"]
# Isolated BSP-only four live Ring3 ELFs, never the default kernel.
p3-ring3-four-elf-live-smoke = ["p3-ring3-four-elf-preflight-smoke"]

[profile.dev]
panic = "abort"

[profile.release]
panic = "abort"
lto = true
codegen-units = 1
opt-level = "s"
